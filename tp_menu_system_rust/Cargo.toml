[package]
name = "tp_menu_system_rust"
version = "0.1.0"
edition = "2021"
description = "Bevy menu system plugin with pages, dimmer, and pause"
authors = ["TPMenuSystem Port"]
license = "MIT OR Apache-2.0"
repository = "https://example.com/"
readme = "README.md"

[dependencies]
bevy = { version = "0.14", default-features = false, features = [
  "bevy_render",
  "bevy_asset",
  "bevy_winit",
  "bevy_core_pipeline",
  "bevy_sprite",
  "bevy_ui",
  "multi_threaded",
] }

[dev-dependencies]
bevy = { version = "0.14", default-features = false, features = [
  "bevy_render",
  "bevy_asset",
  "bevy_winit",
  "bevy_core_pipeline",
  "bevy_sprite",
  "bevy_ui",
  "x11",
  "multi_threaded",
] }

[lib]
name = "tp_menu_system_rust"
path = "src/lib.rs"

[[example]]
name = "demo"
path = "examples/demo.rs"
